name: Quark签到

on:
  schedule:
    - cron: '0 1 * * *' # 北京时间 09:00（UTC 01:00）
    - cron: '0 5 * * *' # 北京时间 13:00（UTC 05:00，失败兜底）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-signin
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: python -m pip install --upgrade pip requests

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 60))
          echo "随机延迟 $delay 秒后执行签到"
          sleep "$delay"

      - name: 执行夸克签到
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py
